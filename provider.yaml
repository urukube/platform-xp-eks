---
# upbound-provider-aws-ec2 is declared in platform-xp-crossplane-shared/providers.yaml
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-eks
spec:
  package: xpkg.upbound.io/upbound/provider-aws-eks:v1.21.0
  runtimeConfigRef:
    name: provider-aws-irsa
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-autoscaling
spec:
  package: xpkg.upbound.io/upbound/provider-aws-autoscaling:v1.21.0
  runtimeConfigRef:
    name: provider-aws-irsa
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-iam
spec:
  package: xpkg.upbound.io/upbound/provider-aws-iam:v1.21.0
  runtimeConfigRef:
    name: provider-aws-irsa

---
# Talks to the orchestrator cluster's own API server (InjectedIdentity) to
# register each new EKS cluster with the orchestrator's ArgoCD. The
# Provider/DeploymentRuntimeConfig/ProviderConfig themselves are declared
# once in platform-xp-crossplane-shared/provider-kubernetes.yaml (shared
# with platform-xp-argo-appset) — declaring them here too would make ArgoCD
# see two Applications independently owning the same objects, producing a
# permanent SharedResourceWarning. Only this repo's own scoped RBAC lives
# here, bound to that shared provider's ServiceAccount.
#
# Scoped to Secrets in the argocd namespace only — this provider must never
# be able to touch resources outside of it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-kubernetes-argocd-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-kubernetes-argocd-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes-incluster
    namespace: crossplane-system
roleRef:
  kind: Role
  name: provider-kubernetes-argocd-clusters
  apiGroup: rbac.authorization.k8s.io
