---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xueks.compute.platform.urukube.io
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: compute.platform.urukube.io/v1alpha1
    kind: XUEks
  mode: Pipeline
  pipeline:
    # -------------------------------------------------------------------------
    # Step 1 — Resolve EnvironmentConfigs into the pipeline context.
    # -------------------------------------------------------------------------
    - step: resolve-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: org-defaults
            - type: Selector
              selector:
                matchLabels:
                  - key: bu-id
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.parameters.buId

    # -------------------------------------------------------------------------
    # Step 2 — ProviderConfig (static, via patch-and-transform).
    # -------------------------------------------------------------------------
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: provider-config
            base:
              apiVersion: aws.upbound.io/v1beta1
              kind: ProviderConfig
              spec:
                credentials:
                  source: IRSA
                assumeRoleChain:
                  - roleARN: placeholder
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.awsAccountId
                toFieldPath: spec.assumeRoleChain[0].roleARN
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "arn:aws:iam::%s:role/urukube-crossplane-role"
            readinessChecks:
              - type: None

    # -------------------------------------------------------------------------
    # Step 3 — Create urukube-argocd-role in the target account.
    # Trust-only role used to give the orchestrator's ArgoCD an identity for
    # EKS API auth (see the register-argocd step). No permissions policy is
    # attached — authorization happens entirely through the EKS Access Entry
    # granted in the cluster step, not IAM. The external-name is fixed so
    # later steps can construct its ARN by convention without an
    # observed-state lookup. Runs as its own step, ahead of the other IAM
    # resources, since nothing else in this composition depends on it.
    # -------------------------------------------------------------------------
    - step: argocd-role
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params := .observed.composite.resource.spec.parameters }}
            {{- $obs    := default (dict) .observed.resources }}
            {{- $pcRef  := .observed.composite.resource.metadata.name }}
            {{- $argocdIrsaRoleArn := (index .context "apiextensions.crossplane.io/environment").orchestratorArgocdRoleArn }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: argocd-role
                {{- if index $readyMap "argocd-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
                crossplane.io/external-name: urukube-argocd-role
            spec:
              forProvider:
                assumeRolePolicy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [{
                      "Effect": "Allow",
                      "Principal": { "AWS": {{ $argocdIrsaRoleArn | quote }} },
                      "Action": "sts:AssumeRole"
                    }]
                  }
                tags:
                  Name: urukube-argocd-role
                  env: {{ $params.env }}
                  bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

    # -------------------------------------------------------------------------
    # Step 4 — IAM resources.
    # Resources: Node Role, InstanceProfile, 5x node RPAs, Cluster Role, Cluster RPA.
    # -------------------------------------------------------------------------
    - step: iam-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params  := .observed.composite.resource.spec.parameters }}
            {{- $obs     := default (dict) .observed.resources }}
            {{- $clsName := printf "%s-eks" $params.friendlyName }}
            {{- $pcRef   := .observed.composite.resource.metadata.name }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $permsBoundary := "" }}
            {{- if $params.iamPermissionsBoundaryArn }}
            {{- $permsBoundary = $params.iamPermissionsBoundaryArn }}
            {{- end }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: node-iam-role
                {{- if index $readyMap "node-iam-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                role-for: eks-nodes
            spec:
              forProvider:
                assumeRolePolicy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [{
                      "Effect": "Allow",
                      "Principal": { "Service": "ec2.amazonaws.com" },
                      "Action": "sts:AssumeRole"
                    }]
                  }
                {{- if $permsBoundary }}
                permissionsBoundary: {{ $permsBoundary }}
                {{- end }}
                tags:
                  Name: {{ printf "%s-node-role" $clsName }}
                  env: {{ $params.env }}
                  bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: InstanceProfile
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: node-instance-profile
                {{- if index $readyMap "node-instance-profile" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                roleSelector:
                  matchControllerRef: true
                  matchLabels:
                    role-for: eks-nodes
              providerConfigRef:
                name: {{ $pcRef }}

            {{- $nodePolicies := dict
                  "worker-node"  "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                  "cni"          "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
                  "ecr"          "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
                  "ssm"          "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
                  "cloudwatch"   "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
            }}
            {{- range $key, $arn := $nodePolicies }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "node-rpa-%s" $key }}
                {{- if index $readyMap (printf "node-rpa-%s" $key) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                policyArn: {{ $arn }}
                roleSelector:
                  matchControllerRef: true
                  matchLabels:
                    role-for: eks-nodes
              providerConfigRef:
                name: {{ $pcRef }}
            {{- end }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster-iam-role
                {{- if index $readyMap "cluster-iam-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                role-for: eks-cluster
            spec:
              forProvider:
                assumeRolePolicy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [{
                      "Effect": "Allow",
                      "Principal": { "Service": "eks.amazonaws.com" },
                      "Action": "sts:AssumeRole"
                    }]
                  }
                {{- if $permsBoundary }}
                permissionsBoundary: {{ $permsBoundary }}
                {{- end }}
                tags:
                  Name: {{ printf "%s-cluster-role" $clsName }}
                  env: {{ $params.env }}
                  bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster-rpa-eks
                {{- if index $readyMap "cluster-rpa-eks" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                policyArn: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
                roleSelector:
                  matchControllerRef: true
                  matchLabels:
                    role-for: eks-cluster
              providerConfigRef:
                name: {{ $pcRef }}

    # -------------------------------------------------------------------------
    # Step 5 — EKS Cluster + kube-proxy addon.
    # Reads cluster-iam-role ARN from observed state once IAM step completes.
    # -------------------------------------------------------------------------
    - step: cluster
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params  := .observed.composite.resource.spec.parameters }}
            {{- $obs     := default (dict) .observed.resources }}
            {{- $clsName := printf "%s-eks" $params.friendlyName }}
            {{- $pcRef   := .observed.composite.resource.metadata.name }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $privateEndpoint := ne $params.endpointAccessType "public" }}
            {{- $publicEndpoint  := ne $params.endpointAccessType "private" }}
            {{- $publicCidrs     := list "0.0.0.0/0" }}
            {{- if eq $params.endpointAccessType "private_with_public_cidrs" }}
            {{- $publicCidrs = $params.endpointPublicAccessCidrs }}
            {{- end }}

            {{- $clusterRoleArn := "" }}
            {{- if index $obs "cluster-iam-role" }}
            {{- with (index $obs "cluster-iam-role").resource.status.atProvider }}
            {{- $clusterRoleArn = .arn | default "" }}
            {{- end }}
            {{- end }}

            ---
            apiVersion: eks.aws.upbound.io/v1beta2
            kind: Cluster
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: eks-cluster
                {{- if index $readyMap "eks-cluster" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
                crossplane.io/external-name: {{ $clsName }}
              labels:
                resource: eks-cluster
            spec:
              forProvider:
                region: {{ $params.region }}
                version: {{ $params.kubernetesVersion | quote }}
                roleArn: {{ $clusterRoleArn | quote }}
                vpcConfig:
                  subnetIds: {{ toJson $params.subnetIds }}
                  securityGroupIds:
                    - {{ $params.controlPlaneSecurityGroupId }}
                  endpointPrivateAccess: {{ $privateEndpoint }}
                  endpointPublicAccess: {{ $publicEndpoint }}
                  {{- if $publicEndpoint }}
                  publicAccessCidrs: {{ toJson $publicCidrs }}
                  {{- end }}
                enabledClusterLogTypes:
                  - api
                  - audit
                  - authenticator
                  - controllerManager
                  - scheduler
                accessConfig:
                  authenticationMode: API_AND_CONFIG_MAP
                  bootstrapClusterCreatorAdminPermissions: true
                tags:
                  env: {{ $params.env }}
                  bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: Addon
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: addon-kube-proxy
                {{- if index $readyMap "addon-kube-proxy" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                region: {{ $params.region }}
                clusterNameSelector:
                  matchControllerRef: true
                  matchLabels:
                    resource: eks-cluster
                addonName: kube-proxy
                resolveConflictsOnCreate: OVERWRITE
                resolveConflictsOnUpdate: OVERWRITE
                tags:
                  env: {{ $params.env }}
                  bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            # Self-managed worker nodes (this composition uses a plain
            # AutoscalingGroup, not an EKS-managed node group) don't get an
            # implicit access entry the way the cluster creator does via
            # bootstrapClusterCreatorAdminPermissions. Without this, kubelet
            # can reach the API server (once DNS/networking work) but the API
            # server rejects it — no error surfaces anywhere obvious, the
            # symptom is just that zero Node objects ever appear. type:
            # EC2_LINUX is required for self-managed Linux nodes; STANDARD
            # (the default) doesn't allow this role to register as a node.
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: AccessEntry
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: access-entry-node-role
                {{- if index $readyMap "access-entry-node-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                region: {{ $params.region }}
                clusterNameSelector:
                  matchControllerRef: true
                  matchLabels:
                    resource: eks-cluster
                type: EC2_LINUX
                principalArnFromRoleSelector:
                  matchControllerRef: true
                  matchLabels:
                    role-for: eks-nodes
              providerConfigRef:
                name: {{ $pcRef }}

            {{- /* urukube-argocd-role is created in Step 3 (argocd-role) — this just grants it cluster access. */ -}}
            {{- $argocdRoleArn := printf "arn:aws:iam::%s:role/urukube-argocd-role" $params.awsAccountId }}
            {{- $adminArns := append (default (list) $params.adminRoleArns) $argocdRoleArn }}
            {{- range $i, $roleArn := $adminArns }}
            {{- $slug := $roleArn | splitList "/" | last }}
            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: AccessEntry
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "access-entry-%s" $slug }}
                {{- if index $readyMap (printf "access-entry-%s" $slug) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                region: {{ $params.region }}
                clusterNameSelector:
                  matchControllerRef: true
                  matchLabels:
                    resource: eks-cluster
                principalArn: {{ $roleArn }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: AccessPolicyAssociation
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "access-policy-%s" $slug }}
                {{- if index $readyMap (printf "access-policy-%s" $slug) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                region: {{ $params.region }}
                clusterNameSelector:
                  matchControllerRef: true
                  matchLabels:
                    resource: eks-cluster
                principalArn: {{ $roleArn }}
                policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
                accessScope:
                  type: cluster
              providerConfigRef:
                name: {{ $pcRef }}
            {{- end }}

    # -------------------------------------------------------------------------
    # Step 6 — Compute resources.
    # Resources: LaunchTemplate, ASG, SG ingress rules (conditional on cluster SG).
    # -------------------------------------------------------------------------
    - step: compute
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params  := .observed.composite.resource.spec.parameters }}
            {{- $obs     := default (dict) .observed.resources }}
            {{- $clsName := printf "%s-eks" $params.friendlyName }}
            {{- $pcRef   := .observed.composite.resource.metadata.name }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /*
              nodeadm on this AMI does not auto-discover apiServerEndpoint/
              certificateAuthority/cidr via eks:DescribeCluster — it fails
              config validation ("... is missing in cluster configuration")
              if spec.cluster only has name. All three are already
              published on the eks-cluster resource's observed status once
              it's Active.
            */}}
            {{- $clusterEndpoint := "" }}
            {{- $caData          := "" }}
            {{- $serviceCidr     := "" }}
            {{- if index $obs "eks-cluster" }}
            {{- with (index $obs "eks-cluster").resource.status.atProvider }}
            {{- $clusterEndpoint = .endpoint | default "" }}
            {{- with index .certificateAuthority 0 }}
            {{- $caData = .data | default "" }}
            {{- end }}
            {{- with .kubernetesNetworkConfig }}
            {{- $serviceCidr = .serviceIpv4Cidr | default "" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $nodeLabels := printf "--node-labels=node.kubernetes.io/instance-type=%s,environment=%s"
                $params.nodeInstanceType $params.env }}
            {{- $ud1 := "---\napiVersion: node.eks.aws/v1alpha1\nkind: NodeConfig\n" }}
            {{- $ud2 := printf "spec:\n  cluster:\n    name: %s\n    apiServerEndpoint: %s\n    certificateAuthority: %s\n    cidr: %s\n"
                $clsName $clusterEndpoint $caData $serviceCidr }}
            {{- $ud3 := printf "  kubelet:\n    config:\n      maxPods: %d\n" (int $params.maxPodsPerNode) }}
            {{- $ud4 := printf "    flags:\n      - \"%s\"\n" $nodeLabels }}
            {{- $userData := print $ud1 $ud2 $ud3 $ud4 }}

            ---
            apiVersion: ec2.aws.upbound.io/v1beta2
            kind: LaunchTemplate
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: node-launch-template
                {{- if index $readyMap "node-launch-template" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                resource: launch-template
            spec:
              forProvider:
                region: {{ $params.region }}
                name: {{ printf "%s-node" $clsName }}
                instanceType: {{ $params.nodeInstanceType }}
                {{- if $params.nodeAmiId }}
                imageId: {{ $params.nodeAmiId }}
                {{- end }}
                userData: {{ $userData | b64enc | quote }}
                metadataOptions:
                  httpEndpoint: enabled
                  httpPutResponseHopLimit: 2
                  httpTokens: required
                iamInstanceProfile:
                  nameSelector:
                    matchControllerRef: true
                networkInterfaces:
                  - associatePublicIpAddress: "false"
                    securityGroups:
                      - {{ $params.nodeSecurityGroupId }}
                blockDeviceMappings:
                  - deviceName: /dev/xvda
                    ebs:
                      volumeSize: 50
                      volumeType: gp3
                      encrypted: "true"
                      deleteOnTermination: "true"
                tagSpecifications:
                  - resourceType: instance
                    tags:
                      Name: {{ printf "%s-node" $clsName }}
                      env: {{ $params.env }}
                      bu_id: {{ $params.buId }}
                  - resourceType: volume
                    tags:
                      env: {{ $params.env }}
                      bu_id: {{ $params.buId }}
              providerConfigRef:
                name: {{ $pcRef }}

            ---
            apiVersion: autoscaling.aws.upbound.io/v1beta3
            kind: AutoscalingGroup
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: node-asg
                {{- if index $readyMap "node-asg" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
                crossplane.io/external-name: {{ printf "%s-sm-wn" $clsName }}
            spec:
              forProvider:
                region: {{ $params.region }}
                minSize: {{ $params.minSize }}
                maxSize: {{ $params.maxSize }}
                desiredCapacity: {{ $params.desiredSize }}
                vpcZoneIdentifier: {{ toJson $params.subnetIds }}
                launchTemplate:
                  idSelector:
                    matchControllerRef: true
                    matchLabels:
                      resource: launch-template
                  version: "$Latest"
                healthCheckType: EC2
                healthCheckGracePeriod: 300
                tag:
                  - key: Name
                    value: {{ printf "%s-node" $clsName }}
                    propagateAtLaunch: true
                  - key: env
                    value: {{ $params.env }}
                    propagateAtLaunch: true
                  - key: bu_id
                    value: {{ $params.buId }}
                    propagateAtLaunch: true
                  - key: {{ printf "kubernetes.io/cluster/%s" $clsName }}
                    value: owned
                    propagateAtLaunch: true
                  - key: k8s.io/cluster-autoscaler/enabled
                    value: "true"
                    propagateAtLaunch: true
                  - key: {{ printf "k8s.io/cluster-autoscaler/%s" $clsName }}
                    value: owned
                    propagateAtLaunch: true
              providerConfigRef:
                name: {{ $pcRef }}

            {{- $clusterSgId := "" }}
            {{- if index $obs "eks-cluster" }}
            {{- with (index $obs "eks-cluster").resource.status.atProvider }}
            {{- with .vpcConfig }}
            {{- $clusterSgId = .clusterSecurityGroupId | default "" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- if $clusterSgId }}
            {{- range $i, $cidr := $params.subnetCidrs }}
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: SecurityGroupIngressRule
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "sgr-cluster-subnet-%d" $i }}
                {{- if index $readyMap (printf "sgr-cluster-subnet-%d" $i) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                region: {{ $params.region }}
                securityGroupId: {{ $clusterSgId }}
                cidrIpv4: {{ $cidr }}
                fromPort: 443
                toPort: 443
                ipProtocol: tcp
                description: {{ printf "Allow HTTPS from node subnet %s to EKS control plane" $cidr }}
              providerConfigRef:
                name: {{ $pcRef }}
            {{- end }}
            {{- end }}

    # -------------------------------------------------------------------------
    # Step 7 — Write status back to the composite resource.
    # Reads cluster endpoint, OIDC issuer, and CA data from observed state.
    # -------------------------------------------------------------------------
    - step: write-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $obs  := default (dict) .observed.resources }}

            {{- $clusterName     := "" }}
            {{- $clusterEndpoint := "" }}
            {{- $oidcArn         := "" }}
            {{- $oidcUrl         := "" }}
            {{- $caData          := "" }}
            {{- if index $obs "eks-cluster" }}
            {{- $c := (index $obs "eks-cluster").resource }}
            {{- with $c.status.atProvider }}
            {{- $clusterName     = .name | default "" }}
            {{- $clusterEndpoint = .endpoint | default "" }}
            {{- with index .certificateAuthority 0 }}
            {{- $caData = .data | default "" }}
            {{- end }}
            {{- with index .identity 0 }}
            {{- with index .oidc 0 }}
            {{- $oidcArn = .issuer | default "" }}
            {{- $oidcUrl = .issuer | default "" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- if $clusterEndpoint }}
            ---
            apiVersion: compute.platform.urukube.io/v1alpha1
            kind: XUEks
            metadata:
              name: {{ $name }}
            status:
              clusterName: {{ $clusterName | quote }}
              clusterEndpoint: {{ $clusterEndpoint | quote }}
              oidcProviderArn: {{ $oidcArn | quote }}
              oidcIssuerUrl: {{ $oidcUrl | quote }}
              clusterCertificateAuthorityData: {{ $caData | quote }}
            {{- end }}

    # -------------------------------------------------------------------------
    # Step 8 — Register the cluster with the orchestrator's ArgoCD.
    # Creates a cluster-registration Secret in the argocd namespace once the
    # cluster reports an endpoint + CA. ArgoCD authenticates via
    # awsAuthConfig, assuming urukube-argocd-role (created in Step 3) in the
    # target account at connection time (same cross-account assume-role
    # pattern used everywhere else in this composition) — no credentials are
    # stored here.
    # -------------------------------------------------------------------------
    - step: register-argocd
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params  := .observed.composite.resource.spec.parameters }}
            {{- $obs     := default (dict) .observed.resources }}
            {{- $clsName := printf "%s-eks" $params.friendlyName }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $clusterEndpoint := "" }}
            {{- $caData          := "" }}
            {{- if index $obs "eks-cluster" }}
            {{- with (index $obs "eks-cluster").resource.status.atProvider }}
            {{- $clusterEndpoint = .endpoint | default "" }}
            {{- with index .certificateAuthority 0 }}
            {{- $caData = .data | default "" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $argocdRoleArn := printf "arn:aws:iam::%s:role/urukube-argocd-role" $params.awsAccountId }}

            {{- if $clusterEndpoint }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: argocd-cluster-secret
                {{- if index $readyMap "argocd-cluster-secret" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata:
                    name: {{ printf "%s-argocd-cluster" $clsName }}
                    namespace: argocd
                    labels:
                      argocd.argoproj.io/secret-type: cluster
                      managed-by: platform-xp-eks
                  stringData:
                    name: {{ $clsName }}
                    server: {{ $clusterEndpoint }}
                    config: |
                      {
                        "awsAuthConfig": {
                          "clusterName": {{ $clsName | quote }},
                          "roleARN": {{ $argocdRoleArn | quote }}
                        },
                        "tlsClientConfig": {
                          "caData": {{ $caData | quote }}
                        }
                      }
              providerConfigRef:
                name: kubernetes-incluster
            {{- end }}
